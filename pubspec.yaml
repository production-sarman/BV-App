name: brahma_vahan
description: Brahma Vahan Assistant App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  open_filex: ^4.3.2
  image_picker: ^1.0.4
  url_launcher: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/APP_Icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/APP_Icon.png"
    icon_size: 48